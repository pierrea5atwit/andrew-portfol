    <!-- The whole page is set in this face. Without a preload the browser only
         discovers it after the CSS parses, so text flashes in the fallback and
         reflows. crossorigin is required for font preloads, even same-origin. -->
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Andrew Pierre - CS + Data Science at Wentworth. I build local-first AI systems: agents that run on your own hardware, with your own data."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Andrew Pierre" />
    <meta
      property="og:description"
      content="CS + Data Science at Wentworth. I build local-first AI systems: agents that run on your own hardware, with your own data."
    />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080c0a'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%236ee787' font-family='system-ui,sans-serif' font-weight='700'%3EA%3C/text%3E%3C/svg%3E"
    />
